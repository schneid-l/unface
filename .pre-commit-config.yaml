repos:
  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: gofumpt
        name: gofumpt (check)
        entry: gofumpt -l -d .
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test-short
        name: go test -short
        entry: go test -short -race ./...
        language: system
        pass_filenames: false
        types: [go]
